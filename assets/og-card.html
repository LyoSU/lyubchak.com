<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG Card — Yuri Lyubchak</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:#f5f5f7;color:#1d1d1f;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .grid{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:1fr 1fr;gap:20px;padding:40px;height:630px}
  .card{border-radius:36px;padding:40px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}
  .me{grid-row:span 2;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.05)}
  .me img{width:112px;height:112px;border-radius:50%;object-fit:cover}
  .me h1{font-size:76px;font-weight:700;letter-spacing:-.05em;line-height:.95}
  .me p{font-size:28px;color:#6e6e73;letter-spacing:-.015em;margin-top:18px;line-height:1.3}
  .me p b{color:#1d1d1f;font-weight:600}
  .me .url{font-size:22px;color:#86868b;font-weight:500}
  .fs{background:linear-gradient(160deg,#3b8cf2,#2457c5);color:#fff}
  .fs .n{font-size:104px;font-weight:700;letter-spacing:-.055em;line-height:.9}
  .fs span,.cp span{font-size:22px;opacity:.8}
  .fs .t,.cp .t{font-size:26px;font-weight:600}
  .cp{background:radial-gradient(90% 80% at 100% 100%,rgba(255,122,61,.35),transparent 60%),#0e0e10;color:#f5f5f7}
  .cp .n{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1.05}
</style>
</head>
<body>
<div class="grid">
  <div class="card me">
    <img src="../images/avatar.jpg" alt="">
    <div>
      <h1>Yuri Lyubchak</h1>
      <p><b>AI Platform Architect.</b> Production AI systems and Telegram products used by millions.</p>
    </div>
    <div class="url">lyubchak.com</div>
  </div>
  <div class="card fs"><div class="t">fStik</div><div><div class="n">800K</div><span>monthly users</span></div></div>
  <div class="card cp"><div class="t">Capka</div><div><div class="n">Agent harness,<br>written from scratch</div></div></div>
</div>
</body>
</html>
